# 서버 코드를 올릴 때마다 기록 저장 연기 검사를 자동으로 돌림(2026-10-29 bests null.b 재발 방지).
# 실패하면 GitHub가 저장소 주인에게 메일로 알림 — 사람이 push 전에 검사를 잊어도 바로 드러나게.
name: score-smoke
on:
  push:
    branches: [main]
    paths: ['functions/**', 'lib/**', 'public/js/**', 'tools/check/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --no-warnings tools/check/score-smoke.mjs
  # 게임 열기 검사(2026-11-01 게퍼 10 코드 통째 삭제 사고 재발 방지) — 실제 브라우저에서 게임마다 열고 입력해 봄
  game-open:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node --no-warnings tools/check/game-open.mjs
